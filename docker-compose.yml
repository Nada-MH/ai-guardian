version: '3.9'

services:
  # ─── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_guardian_postgres
    environment:
      POSTGRES_DB: ai_guardian_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis (Cache + Celery Broker) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai_guardian_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Qdrant Vector Database ──────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: ai_guardian_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ─── FastAPI Backend ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ai_guardian_api
    ports:
      - "8000:8000"
    env_file:
      - apps/api/.env.example
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_guardian_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads

volumes:
  pgdata:
  qdrant_data:
