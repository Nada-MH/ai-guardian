[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-guardian-agent-orchestrator"
version = "0.1.0"
description = "AI Guardian - Multi-Agent Compliance Orchestration Engine powered by Groq & LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.1.0",
    "langchain-core>=0.2.0",
    "groq>=0.9.0",
    "openai>=1.30.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]
